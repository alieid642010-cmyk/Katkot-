<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="description" content="كتكوت Pro — تطبيق شامل لإدارة مزارع دواجن التسمين: تسجيل يومي، متابعة الأداء والتحصينات، إدارة المخزون والمالية، وتقارير احترافية.">
    <title>مزرعتي | إدارة دواجن التسمين</title>
    <!-- ============ Manifest كملف خارجي حقيقي (manifest.json) — مطلوب لتغليف التطبيق عبر PWABuilder لمتجر Google Play؛ الـ data URI كان يمنع أدوات فحص الـ Manifest من قراءته بشكل صحيح ============ -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2F4538">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="كتكوت Pro">
    <link rel="apple-touch-icon" href="./icon-192x192-any.png">
    <link rel="icon" type="image/png" sizes="192x192" href="./icon-192x192-any.png">
    <link rel="icon" type="image/png" sizes="512x512" href="./icon-512x512-any.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- ============ 🔒 تحصين أداء: defer على المكتبات الخارجية دي — بتخلي المتصفح يرسم الصفحة أثناء التحميل بدل ما يوقف التفسير لحد ما الملفات دي تخلص (ده كان سبب التقل فى بداية التطبيق) ============ -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- ============ SheetJS (xlsx) — تصدير سجل الدفعة بصيغة إكسل حقيقية (ورقة منسّقة) بدل CSV فقط ============ -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- ============ QRCode.js — توليد QR لمعرّف الجهاز، أسرع وأقل غلط من نسخ UID طويل يدويًا ============ -->
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <!-- ============ Firebase (مزامنة سحابية بين المالك والعمال) ============ -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <!-- ============ Firebase Cloud Messaging — تنبيهات فورية تصل حتى لو التطبيق مقفول ============ -->
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging-compat.js"></script>
